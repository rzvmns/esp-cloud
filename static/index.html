<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP8266 Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #0d0f0e;
      --bg2:    #141714;
      --bg3:    #1a1e1a;
      --green:  #39ff6e;
      --green2: #1a7a3a;
      --green3: #0d3d1e;
      --red:    #ff3b3b;
      --red2:   #7a1a1a;
      --red3:   #3d0d0d;
      --amber:  #ffb830;
      --muted:  #4a5c4a;
      --border: #2a352a;
      --text:   #c8e6c8;
      --text2:  #7a9a7a;
      --mono:   'Share Tech Mono', monospace;
      --sans:   'Barlow', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 20px 16px;
    }

    .dash { max-width: 480px; margin: 0 auto; }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-family: var(--mono); font-size: 13px; color: var(--green); letter-spacing: 2px; }
    .logo span { color: var(--muted); }
    .ip-row { display: flex; align-items: center; gap: 8px; }
    .ip-input {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      font-family: var(--mono);
      font-size: 11px;
      padding: 5px 8px;
      width: 136px;
      outline: none;
      transition: border-color .2s;
    }
    .ip-input:focus { border-color: var(--green); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); flex-shrink: 0; }
    .dot.off { background: var(--muted); box-shadow: none; }

    /* SECTION */
    .sec-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 18px 0 8px;
    }

    /* CARDS */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 14px 16px;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
    }
    .card.ok    { border-color: var(--green2); background: var(--green3); }
    .card.alert { border-color: var(--red2);   background: var(--red3); }

    .metric { font-family: var(--mono); font-size: 26px; color: var(--green); line-height: 1; }
    .metric.dim { color: var(--muted); font-size: 16px; }
    .metric-lbl { font-size: 11px; color: var(--text2); margin-top: 4px; font-family: var(--mono); letter-spacing: 1px; }

    .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* BUTTONS */
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text2);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 1px;
      padding: 12px 10px;
      cursor: pointer;
      text-align: left;
      transition: all .15s;
      clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 0 100%);
      width: 100%;
    }
    .btn:hover  { border-color: var(--green); color: var(--green); background: var(--green3); }
    .btn:active { transform: scale(0.97); }
    .btn.danger { border-color: var(--red2); color: #ff8080; }
    .btn.danger:hover { background: var(--red3); border-color: var(--red); }
    .btn.wide { grid-column: span 2; }
    .btn i { font-size: 14px; margin-right: 6px; vertical-align: -2px; }
    .btn svg { width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; flex-shrink: 0; }
    .list-item svg { width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px; flex-shrink: 0; }
    .btn-sm {
      padding: 4px 10px;
      font-size: 10px;
      clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 0 100%);
      width: auto;
    }

    /* MESSAGE INPUT */
    .msg-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 12px;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg-row { display: flex; gap: 8px; }
    input[type="text"], input[type="password"] {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: var(--green); }

    /* OUTPUT */
    #output {
      margin-top: 16px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-left: 3px solid var(--green2);
      padding: 12px 14px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text2);
      min-height: 42px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
    #output.ok    { border-left-color: var(--green); color: var(--green); }
    #output.error { border-left-color: var(--red);   color: #ff8080; }

    /* SPINNER */
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--muted);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* FLOOD LOG */
    .flood-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-family: var(--mono);
      font-size: 12px;
    }
    .flood-row:last-child { border-bottom: none; }
    .flood-time { color: var(--amber); }
    .flood-empty { color: var(--muted); font-family: var(--mono); font-size: 12px; }

    /* PULSE */
    .pulse { animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

    /* MODALS */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.8);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }

    .modal-box {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 20px;
      width: 320px;
      max-height: 80vh;
      overflow-y: auto;
      clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 0 100%);
    }
    .modal-box h5 {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--green);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .list-item {
      background: var(--bg3);
      border: 1px solid var(--border);
      padding: 9px 12px;
      font-family: var(--mono);
      font-size: 12px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .list-item:hover { border-color: var(--green); color: var(--green); }
    .list-item.no-hover { cursor: default; }
    .list-item.no-hover:hover { border-color: var(--border); color: var(--text2); }
    .list-item.flood-row-modal {
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: default;
    }
    .list-item.flood-row-modal:hover { border-color: var(--border); color: var(--text); }

    #passwordBox { display: none; flex-direction: column; gap: 8px; margin-top: 8px; }
    .text-muted { color: var(--muted); font-size: 12px; font-family: var(--mono); text-align: center; padding: 8px 0; }

    .divider { height: 1px; background: var(--border); margin: 12px 0; }
  </style>
</head>
<body>
<div class="dash">

  <div class="header">
    <div class="logo"><span>//</span> ESP8266 <span>CTRL</span></div>
    <div class="ip-row">
      <div class="dot off" id="connDot"></div>
      <input class="ip-input" id="espIp" placeholder="192.168.4.1" value="192.168.4.1">
    </div>
  </div>

  <div class="sec-label">sensors</div>
  <div class="sensor-grid">
    <div class="card" id="tempCard">
      <div class="metric dim" id="tempVal">--.-°C</div>
      <div class="metric-lbl">temperature</div>
    </div>
    <div class="card" id="floodCard">
      <div class="metric dim" id="floodVal">-- CLEAR</div>
      <div class="metric-lbl">flood sensor</div>
    </div>
  </div>

  <div class="sec-label">controls</div>
  <div class="btn-grid">
    <button class="btn" onclick="sendCmd('led on')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h1m8-9v1m8 8h1M5.6 5.6l.7.7m12.1-.7-.7.7M9 16a5 5 0 1 1 6 0 3.5 3.5 0 0 0-1 3 2 2 0 0 1-4 0 3.5 3.5 0 0 0-1-3"/><line x1="9.7" y1="17" x2="14.3" y2="17"/></svg>LED ON</button>
    <button class="btn danger" onclick="sendCmd('led off')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="3" x2="21" y2="21"/><path d="M9 16a5 5 0 0 1 -.9-9.1M13.5 6.6A5 5 0 0 1 17 12a5 5 0 0 1-.8 2.7M9 16a3.5 3.5 0 0 0-1 3 2 2 0 0 0 4 0 3.5 3.5 0 0 0-1-3"/><line x1="9.7" y1="17" x2="14.3" y2="17"/></svg>LED OFF</button>
    <button class="btn" onclick="refreshTemp()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a4 4 0 1 0 4 0V5a2 2 0 0 0-4 0v8.5"/><line x1="10" y1="9" x2="14" y2="9"/></svg>READ TEMP</button>
    <button class="btn" onclick="refreshFlood()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6 10 4 14.5 4 17a8 8 0 0 0 16 0c0-2.5-2-7-8-15z"/></svg>READ FLOOD</button>
    <button class="btn wide" onclick="scanWifi()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.1 8.2a14.5 14.5 0 0 1 19.8 0"/><path d="M5.6 11.7a10 10 0 0 1 12.8 0"/><path d="M9.3 15.2a5.5 5.5 0 0 1 5.4 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>SCAN NETWORKS</button>
    <button class="btn" onclick="showStatus()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="20" height="6" rx="2"/><circle cx="7" cy="12" r="1" fill="currentColor"/><circle cx="11" cy="12" r="1" fill="currentColor"/><path d="M7 3v2m4-2v2m4-2v2M7 19v2m4-2v2m4-2v2"/></svg>STATUS</button>
    <button class="btn" onclick="loadSavedNetworks()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>SAVED NETS</button>
    <button class="btn danger" id="btnDisconnect" style="display:none" onclick="disconnectWifi()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 7h1a2 2 0 0 1 2 2v1"/><path d="M9 7H8a2 2 0 0 0-2 2v1"/><path d="M7 17v-1a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1"/><line x1="9" y1="3" x2="9" y2="7"/><line x1="15" y1="3" x2="15" y2="7"/><line x1="7" y1="17" x2="7" y2="21"/><line x1="17" y1="17" x2="17" y2="21"/><line x1="17" y1="11" x2="21" y2="15"/><line x1="21" y1="11" x2="17" y2="15"/></svg>DISCONNECT</button>
  </div>

  <div class="sec-label">message</div>
  <div class="msg-card">
    <div class="msg-row">
      <input type="text" id="msgInput" placeholder="Send message to ESP...">
      <button class="btn btn-sm" onclick="sendMessage()">SEND</button>
    </div>
    <button class="btn wide" onclick="loadMessages()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>VIEW SAVED MESSAGES</button>
  </div>

  <div class="sec-label">flood log</div>
  <div class="card" id="floodLogCard" style="padding:12px 16px">
    <div id="floodLogEntries" class="flood-empty">LOADING...</div>
  </div>
  <button class="btn wide" style="margin-top:8px;grid-column:unset;width:100%" onclick="loadFloodEventsModal()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.4L1.6 18a2 2 0 0 0 1.7 3h17.4a2 2 0 0 0 1.7-3L13.7 3.4a2 2 0 0 0-3.4 0z"/><line x1="12" y1="9" x2="12" y2="13"/><circle cx="12" cy="17" r="1" fill="currentColor"/></svg>FLOOD EVENTS LOG</button>

  <div id="output">READY_</div>
</div>

<!-- WIFI MODAL -->
<div class="modal-overlay" id="wifiModal">
  <div class="modal-box">
    <h5>// select network</h5>
    <ul class="list" id="networkList"></ul>
    <div id="passwordBox">
      <input type="password" id="wifiPassword" placeholder="Password">
      <button class="btn" onclick="submitPassword()">CONNECT</button>
    </div>
    <div class="divider"></div>
    <button class="btn wide" onclick="closeModal('wifiModal')">CLOSE</button>
  </div>
</div>

<!-- STATUS MODAL -->
<div class="modal-overlay" id="statusModal">
  <div class="modal-box">
    <h5>// wifi status</h5>
    <div id="statusContent" style="font-family:var(--mono);font-size:12px;margin-bottom:14px;white-space:pre-wrap;color:var(--text2)"></div>
    <div class="divider"></div>
    <button class="btn wide" onclick="closeModal('statusModal')">CLOSE</button>
  </div>
</div>

<!-- SAVED MODAL -->
<div class="modal-overlay" id="savedModal">
  <div class="modal-box">
    <h5>// saved networks</h5>
    <ul class="list" id="savedList"></ul>
    <div class="divider"></div>
    <button class="btn wide" onclick="closeModal('savedModal')">CLOSE</button>
  </div>
</div>

<!-- MESSAGES MODAL -->
<div class="modal-overlay" id="messagesModal">
  <div class="modal-box">
    <h5>// saved messages</h5>
    <ul class="list" id="messagesList"></ul>
    <div class="divider"></div>
    <button class="btn wide" onclick="closeModal('messagesModal')">CLOSE</button>
  </div>
</div>

<!-- FLOOD MODAL -->
<div class="modal-overlay" id="floodModal">
  <div class="modal-box">
    <h5>// flood events</h5>
    <ul class="list" id="floodList"></ul>
    <p id="floodEmpty" class="text-muted" style="display:none">NO EVENTS RECORDED</p>
    <div class="divider"></div>
    <button class="btn wide" onclick="closeModal('floodModal')">CLOSE</button>
  </div>
</div>


<script>
let selectedNetworkId = null;
let isConnected = false;

function ESP(cmd) {
  const ip = document.getElementById('espIp').value.trim() || '192.168.4.1';
  return '/proxy?ip=' + encodeURIComponent(ip) + '&c=' + encodeURIComponent(cmd);
}

function updateConnectionUI() {
  document.getElementById('btnDisconnect').style.display = isConnected ? 'block' : 'none';
  const dot = document.getElementById('connDot');
  dot.className = 'dot' + (isConnected ? '' : ' off');
}

function showLoading() {
  const o = document.getElementById('output');
  o.className = '';
  o.innerHTML = '<span class="spinner"></span>PROCESSING...';
}

function setOutput(text, type) {
  const o = document.getElementById('output');
  o.className = type || '';
  o.innerText = text + '_';
  const t = text.toLowerCase();
  if (t.includes('connected to'))                                isConnected = true;
  if (t.includes('disconnected') || t.includes('not connected')) isConnected = false;
  updateConnectionUI();
}

function sendCmd(cmd) {
  showLoading();
  fetch(ESP(cmd))
    .then(r => r.text()).then(t => setOutput(t))
    .catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function refreshTemp() {
  showLoading();
  fetch(ESP('temp')).then(r => r.text()).then(t => {
    const m = t.match(/Temp:\s*([\d.]+)C\s+Hum:\s*([\d.]+)/);
    if (m) {
      document.getElementById('tempVal').innerText = parseFloat(m[1]).toFixed(1) + '°C';
      document.getElementById('tempVal').className = 'metric';
      document.getElementById('tempCard').className = 'card ok';
      setOutput('TEMP: ' + parseFloat(m[1]).toFixed(1) + '°C   HUM: ' + parseFloat(m[2]).toFixed(1) + '%', 'ok');
    } else {
      setOutput(t, 'error');
    }
  }).catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function refreshFlood() {
  showLoading();
  fetch(ESP('flood')).then(r => r.text()).then(t => {
    const flooded = t.toLowerCase().includes('flood detected');
    const card = document.getElementById('floodCard');
    const val  = document.getElementById('floodVal');
    if (flooded) {
      val.innerText = '!! FLOOD';
      val.className = 'metric pulse';
      val.style.color = 'var(--red)';
      card.className = 'card alert';
      setOutput(t, 'error');
    } else {
      val.innerText = '-- CLEAR';
      val.className = 'metric dim';
      val.style.color = '';
      card.className = 'card ok';
      setOutput(t, 'ok');
    }
    loadFloodLog();
  }).catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function loadFloodLog() {
  fetch(ESP('flood-events')).then(r => r.text()).then(t => {
    const el = document.getElementById('floodLogEntries');
    if (t.trim() === 'No events') {
      el.innerHTML = '<span class="flood-empty">NO EVENTS RECORDED</span>';
      return;
    }
    el.innerHTML = '';
    t.split('\n').forEach(line => {
      if (!line.trim()) return;
      const [idx, ts] = line.split('|');
      const row = document.createElement('div');
      row.className = 'flood-row';
      row.innerHTML = '<span class="flood-time">[' + ts + ']</span>'
        + '<button class="btn btn-sm danger" onclick="deleteFloodEvent(' + idx + ')">DEL</button>';
      el.appendChild(row);
    });
  }).catch(() => {
    document.getElementById('floodLogEntries').innerHTML = '<span class="flood-empty">UNAVAILABLE</span>';
  });
}

function loadFloodEventsModal() {
  showLoading();
  fetch(ESP('flood-events')).then(r => r.text()).then(text => {
    const list  = document.getElementById('floodList');
    const empty = document.getElementById('floodEmpty');
    list.innerHTML = '';
    if (text.trim() === 'No events') {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      text.split('\n').forEach(line => {
        if (!line.trim()) return;
        const [idx, ts] = line.split('|');
        const li = document.createElement('li');
        li.className = 'list-item flood-row-modal';
        li.innerHTML = '<span style="color:var(--amber)">[' + ts + ']</span>'
          + '<button class="btn btn-sm danger" onclick="deleteFloodEventModal(' + idx + ', this)">DEL</button>';
        list.appendChild(li);
      });
    }
    setOutput('FLOOD EVENTS LOADED', 'ok');
    openModal('floodModal');
  });
}

function deleteFloodEvent(idx) {
  fetch(ESP('flood-delete ' + idx)).then(() => loadFloodLog());
}

function deleteFloodEventModal(idx, btn) {
  btn.disabled = true; btn.innerText = '...';
  fetch(ESP('flood-delete ' + idx)).then(() => {
    closeModal('floodModal');
    loadFloodEventsModal();
    loadFloodLog();
  });
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg) return;
  showLoading();
  fetch(ESP('send-message ' + msg))
    .then(r => r.text()).then(t => { input.value = ''; setOutput(t); })
    .catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function loadMessages() {
  showLoading();
  fetch(ESP('messages')).then(r => r.text()).then(text => {
    const list = document.getElementById('messagesList');
    list.innerHTML = '';
    if (text.trim() === 'No messages') {
      list.innerHTML = '<li class="list-item no-hover text-muted">NO MESSAGES SAVED</li>';
    } else {
      text.split('\n').forEach(line => {
        if (!line.trim()) return;
        const li = document.createElement('li');
        li.className = 'list-item no-hover';
        li.innerText = line;
        list.appendChild(li);
      });
    }
    setOutput('MESSAGES LOADED', 'ok');
    openModal('messagesModal');
  }).catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function scanWifi() {
  showLoading();
  fetch(ESP('scan')).then(r => r.text()).then(showNetworks)
    .catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function showNetworks(text) {
  const list = document.getElementById('networkList');
  list.innerHTML = '';
  text.split('\n').forEach(line => {
    if (!line.trim()) return;
    const id = line.split(':')[0];
    const isOpen = line.includes('(OPEN)');
    const li = document.createElement('li');
    li.className = 'list-item';
    const svgWifi = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;vertical-align:-2px"><path d="M2.1 8.2a14.5 14.5 0 0 1 19.8 0"/><path d="M5.6 11.7a10 10 0 0 1 12.8 0"/><path d="M9.3 15.2a5.5 5.5 0 0 1 5.4 0"/><circle cx="12" cy="19" r="1" fill="currentColor"/></svg>';
    const svgWifiLock = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;vertical-align:-2px"><path d="M2.1 8.2a14.5 14.5 0 0 1 19.8 0"/><path d="M5.6 11.7a10 10 0 0 1 12.8 0"/><path d="M9.3 15.2a5.5 5.5 0 0 1 5.4 0"/><rect x="9" y="17" width="6" height="5" rx="1"/><path d="M11 17v-2a1 1 0 0 1 2 0v2"/></svg>';
    li.innerHTML = (isOpen ? svgWifi : svgWifiLock) + line;
    li.onclick = () => selectNetwork(id, isOpen);
    list.appendChild(li);
  });
  openModal('wifiModal');
  setOutput('SCAN COMPLETE', 'ok');
}

function selectNetwork(id, isOpen) {
  selectedNetworkId = id;
  const pb = document.getElementById('passwordBox');
  if (isOpen) { pb.style.display = 'none'; connectNetwork(id, ''); }
  else        { pb.style.display = 'flex'; }
}

function submitPassword() {
  connectNetwork(selectedNetworkId, document.getElementById('wifiPassword').value);
}

function connectNetwork(id, password) {
  closeModal('wifiModal');
  showLoading();
  let cmd = 'connect ' + id + (password ? ' ' + password : '');
  fetch(ESP(cmd)).then(r => r.text()).then(t => setOutput(t))
    .catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function disconnectWifi() {
  showLoading();
  fetch(ESP('disconnect')).then(r => r.text()).then(t => {
    isConnected = false; setOutput(t);
  }).catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function showStatus() {
  document.getElementById('statusContent').innerHTML = '<span class="spinner"></span>';
  fetch(ESP('status')).then(r => r.text()).then(text => {
    document.getElementById('statusContent').innerText = text;
    isConnected = text.toLowerCase().includes('connected to');
    updateConnectionUI();
    openModal('statusModal');
  }).catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function loadSavedNetworks() {
  showLoading();
  fetch(ESP('saved')).then(r => r.text()).then(text => {
    const list = document.getElementById('savedList');
    list.innerHTML = '';
    text.split('\n').forEach(line => {
      if (!line.trim()) return;
      const li = document.createElement('li');
      li.className = 'list-item';
      li.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px;margin-right:6px;vertical-align:-2px"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></svg>' + line;
      li.onclick = () => connectSaved(line + ';');
      list.appendChild(li);
    });
    openModal('savedModal');
  }).catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function connectSaved(ssid) {
  closeModal('savedModal');
  showLoading();
  fetch(ESP('connect-saved ' + ssid)).then(r => r.text()).then(t => setOutput(t))
    .catch(() => setOutput('CONNECTION FAILED', 'error'));
}

function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
});

window.onload = () => {
  showLoading();
  fetch(ESP('status')).then(r => r.text()).then(t => setOutput(t))
    .catch(() => setOutput('ESP OFFLINE', 'error'));
  loadFloodLog();
};
</script>
</body>
</html>
