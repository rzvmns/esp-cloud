services:
  - type: web
    name: esp8266-cloud
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: API_KEY
        sync: false
